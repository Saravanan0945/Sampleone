# ===============================
# TEST CONFIGURATION
# ===============================
spring.application.name=secure-auth-system-test

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration for Testing
jwt.secret=testSecretKey123456789testSecretKey123456789testSecretKey
jwt.expiration=3600000
jwt.refresh-expiration=7200000

# Security Configuration for Testing
security.max-failed-attempts=3
security.lockout-duration=60000
security.password.encoder.strength=4

# Logging Configuration for Testing
logging.level.root=WARN
logging.level.com.webapp.auth=INFO
logging.level.org.springframework.security=WARN

# Disable Actuator in Tests
management.endpoints.enabled-by-default=false

