<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Register - Secure Authentication System</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-plus header-icon"></i>
                <h1>Create Account</h1>
                <p>Sign up to get started</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="message error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="message success-message" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <!-- Registration Form -->
            <form id="registerForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a username"
                        required
                        autocomplete="username"
                        aria-label="Username"
                    >
                    <span class="field-error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                        aria-label="Email"
                    >
                    <span class="field-error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="firstName">
                        <i class="fas fa-id-card"></i>
                        First Name
                    </label>
                    <input 
                        type="text" 
                        id="firstName" 
                        name="firstName" 
                        placeholder="Enter your first name"
                        required
                        autocomplete="given-name"
                        aria-label="First Name"
                    >
                    <span class="field-error" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">
                        <i class="fas fa-id-card"></i>
                        Last Name
                    </label>
                    <input 
                        type="text" 
                        id="lastName" 
                        name="lastName" 
                        placeholder="Enter your last name"
                        required
                        autocomplete="family-name"
                        aria-label="Last Name"
                    >
                    <span class="field-error" id="lastNameError"></span>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-key"></i>
                        Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Create a password"
                            required
                            autocomplete="new-password"
                            aria-label="Password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="toggle-password"
                            aria-label="Toggle password visibility"
                            tabindex="-1"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                    <small style="color: #6b7280; font-size: 12px; margin-top: 4px; display: block;">
                        Password must be at least 8 characters with uppercase, lowercase, and number
                    </small>
                </div>

                <button type="submit" id="registerBtn" class="login-btn">
                    <span id="btnText">Create Account</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="login-footer">
                <p>Already have an account? <a href="/login.html">Login</a></p>
            </div>
        </div>
    </div>

    <script src="/js/auth-check.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
