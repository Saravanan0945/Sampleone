<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>User Profile - Secure Authentication System</title>
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-shield-alt"></i>
                <span>Secure Auth System</span>
            </div>
            <div class="nav-menu">
                <a href="/profile.html" class="nav-link active">
                    <i class="fas fa-user"></i>
                    Profile
                </a>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="profile-container">
            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="profile-info">
                    <h1 id="userName">Loading...</h1>
                    <p id="userEmail">Loading...</p>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="message error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="message success-message" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <!-- Profile Details Card -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>
                        <i class="fas fa-id-card"></i>
                        Profile Details
                    </h2>
                </div>
                <div class="card-body">
                    <div class="profile-field">
                        <label>User ID</label>
                        <span id="userId">-</span>
                    </div>
                    <div class="profile-field">
                        <label>Username</label>
                        <span id="username">-</span>
                    </div>
                    <div class="profile-field">
                        <label>Email</label>
                        <span id="email">-</span>
                    </div>
                    <div class="profile-field">
                        <label>First Name</label>
                        <span id="firstName">-</span>
                    </div>
                    <div class="profile-field">
                        <label>Last Name</label>
                        <span id="lastName">-</span>
                    </div>
                    <div class="profile-field">
                        <label>Last Login</label>
                        <span id="lastLogin">-</span>
                    </div>
                    <div class="profile-field">
                        <label>Account Created</label>
                        <span id="createdAt">-</span>
                    </div>
                </div>
            </div>

            <!-- Account Actions Card -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>
                        <i class="fas fa-cog"></i>
                        Account Actions
                    </h2>
                </div>
                <div class="card-body">
                    <button class="action-btn" id="changePasswordBtn">
                        <i class="fas fa-key"></i>
                        Change Password
                    </button>
                    <button class="action-btn" id="refreshTokenBtn">
                        <i class="fas fa-sync-alt"></i>
                        Refresh Session
                    </button>
                </div>
            </div>

            <!-- Session Info Card -->
            <div class="profile-card">
                <div class="card-header">
                    <h2>
                        <i class="fas fa-clock"></i>
                        Session Information
                    </h2>
                </div>
                <div class="card-body">
                    <div class="profile-field">
                        <label>Session Timeout</label>
                        <span>30 minutes of inactivity</span>
                    </div>
                    <div class="profile-field">
                        <label>Token Expiry</label>
                        <span id="tokenExpiry">-</span>
                    </div>
                    <div class="profile-field">
                        <label>Session Status</label>
                        <span class="status-badge status-active">
                            <i class="fas fa-circle"></i>
                            Active
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
    </div>

    <script src="/js/auth-check.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
