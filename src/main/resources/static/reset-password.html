<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Reset Password - Secure Authentication System</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-lock header-icon"></i>
                <h1>Reset Password</h1>
                <p>Enter your new password below</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="message error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="message success-message" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <!-- Reset Password Form -->
            <form id="resetPasswordForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="newPassword">
                        <i class="fas fa-key"></i>
                        New Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            placeholder="Enter new password"
                            required
                            autocomplete="new-password"
                            aria-label="New Password"
                        >
                        <button 
                            type="button" 
                            id="toggleNewPassword" 
                            class="toggle-password"
                            aria-label="Toggle password visibility"
                            tabindex="-1"
                        >
                            <i class="fas fa-eye" id="toggleNewIcon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="newPasswordError"></span>
                    <small style="color: #6b7280; font-size: 12px; margin-top: 4px; display: block;">
                        Password must be at least 8 characters long
                    </small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-check-double"></i>
                        Confirm Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Confirm new password"
                            required
                            autocomplete="new-password"
                            aria-label="Confirm Password"
                        >
                        <button 
                            type="button" 
                            id="toggleConfirmPassword" 
                            class="toggle-password"
                            aria-label="Toggle password visibility"
                            tabindex="-1"
                        >
                            <i class="fas fa-eye" id="toggleConfirmIcon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="confirmPasswordError"></span>
                </div>

                <!-- Password Strength Indicator -->
                <div id="passwordStrength" class="password-strength" style="display: none;">
                    <div class="strength-bar">
                        <div id="strengthBar" class="strength-bar-fill"></div>
                    </div>
                    <span id="strengthText" class="strength-text"></span>
                </div>

                <button type="submit" id="submitBtn" class="login-btn">
                    <span id="btnText">Reset Password</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="login-footer">
                <p>Remember your password? <a href="/login.html">Back to Login</a></p>
            </div>
        </div>
    </div>

    <style>
        .password-strength {
            margin-bottom: 16px;
        }

        .strength-bar {
            width: 100%;
            height: 6px;
            background-color: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .strength-bar-fill {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
            width: 0%;
        }

        .strength-text {
            font-size: 13px;
            font-weight: 500;
        }

        .strength-weak {
            background-color: #ef4444;
        }

        .strength-fair {
            background-color: #f59e0b;
        }

        .strength-good {
            background-color: #10b981;
        }

        .strength-strong {
            background-color: #059669;
        }
    </style>

    <script src="/js/auth-check.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
