<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Login - Secure Authentication System</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-lock-open header-icon"></i>
                <h1>Welcome Back</h1>
                <p>Please login to your account</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="message error-message" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="message success-message" style="display: none;">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Username or Email
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username or email"
                        required
                        autocomplete="username"
                        aria-label="Username or Email"
                    >
                    <span class="field-error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-key"></i>
                        Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                            aria-label="Password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            class="toggle-password"
                            aria-label="Toggle password visibility"
                            tabindex="-1"
                        >
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <span class="field-error" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="/forgot-password.html" class="forgot-password-link">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit" id="loginBtn" class="login-btn">
                    <span id="btnText">Login</span>
                    <span id="btnSpinner" class="spinner" style="display: none;"></span>
                </button>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="/register.html">Sign up</a></p>
            </div>

            <!-- Rate Limit Warning -->
            <div id="rateLimitWarning" class="rate-limit-warning" style="display: none;">
                <i class="fas fa-shield-alt"></i>
                <span id="rateLimitText"></span>
            </div>
        </div>
    </div>

    <script src="/js/auth-check.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
