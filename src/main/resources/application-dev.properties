# ===============================
# DEVELOPMENT PROFILE CONFIGURATION
# ===============================
# This profile is for local development and testing
# Activate with: --spring.profiles.active=dev or set SPRING_PROFILES_ACTIVE=dev

# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=secure-auth-system-dev
server.port=8080

# ===============================
# H2 IN-MEMORY DATABASE CONFIGURATION
# ===============================
# H2 Database for local development (no external database required)
spring.datasource.url=jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Alternative: H2 File-based Database (persists data between restarts)
#spring.datasource.url=jdbc:h2:file:./data/auth_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
# Auto-create schema on startup, drop on shutdown (for development only)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.defer-datasource-initialization=true

# ===============================
# JWT CONFIGURATION
# ===============================
# Development JWT secret (not secure - for testing only)
jwt.secret=dev-secret-key-for-testing-only-change-in-production-5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
# 24 hours
jwt.refresh.expiration=604800000
# 7 days

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Relaxed security settings for development
security.max-failed-attempts=10
security.lockout-duration=300000
# 5 minutes lockout
security.lockout-duration-minutes=5
security.rate-limit.max-attempts=50
security.rate-limit.window-minutes=15
security.password-reset.expiration-hours=24
security.password.encoder.strength=10
# Lower BCrypt rounds for faster testing

# ===============================
# SESSION CONFIGURATION
# ===============================
server.servlet.session.timeout=60m
# Longer session for development
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
# HTTP allowed in dev

# ===============================
# LOGGING CONFIGURATION
# ===============================
# Verbose logging for development
logging.level.root=INFO
logging.level.com.webapp.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.jdbc.core=DEBUG

# Console logging only (no file logging in dev)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# CORS CONFIGURATION
# ===============================
# Allow all origins in development
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:5173
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===============================
# EMAIL CONFIGURATION
# ===============================
# Mock email service for development (logs to console)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=dev@localhost
spring.mail.password=dev
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
# Expose all actuator endpoints in development
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ===============================
# ERROR HANDLING
# ===============================
# Show detailed error information in development
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ===============================
# HTTPS CONFIGURATION
# ===============================
# Disabled in development
server.ssl.enabled=false

# ===============================
# SQL INITIALIZATION
# ===============================
# Always initialize database with test data in development
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# ===============================
# SWAGGER/OPENAPI CONFIGURATION
# ===============================
# Enable Swagger UI in development
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=true

# ===============================
# DEVELOPMENT TOOLS
# ===============================
# Enable Spring Boot DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.restart.exclude=static/**,public/**

# ===============================
# RATE LIMITING
# ===============================
# Relaxed rate limiting for development
rate.limit.enabled=false
rate.limit.requests-per-minute=1000

# ===============================
# APPLICATION SPECIFIC SETTINGS
# ===============================
app.name=Secure Authentication System (Development)
app.version=1.0.0-DEV
app.frontend.url=http://localhost:3000
app.password-reset.token-expiration=86400000
# 24 hours for easier testing
app.security.max-login-attempts=10
app.security.lockout-duration=5

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.indent-output=true
# Pretty print JSON in development
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

