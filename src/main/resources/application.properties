# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=secure-auth-system
server.port=8080
server.servlet.context-path=/

# ===============================
# DATABASE CONFIGURATION
# ===============================
# MySQL Configuration (Primary) - Use environment variables in production
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL Configuration (Alternative - Uncomment to use)
#spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
#spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD:postgres}
#spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/HIBERNATE CONFIGURATION
# ===============================
# For production, use 'validate' to prevent automatic schema changes
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ===============================
# JWT CONFIGURATION
# ===============================
# IMPORTANT: Change JWT_SECRET in production using environment variable
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=${JWT_EXPIRATION:86400000}
# JWT expiration time in milliseconds (86400000 ms = 24 hours)
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
# Refresh token expiration (604800000 ms = 7 days)

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Account lockout settings
security.max-failed-attempts=${MAX_FAILED_ATTEMPTS:5}
security.lockout-duration=${LOCKOUT_DURATION:900000}
security.lockout-duration-minutes=15

# Rate limiting settings (brute force protection)
security.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:10}
security.rate-limit.window-minutes=${RATE_LIMIT_WINDOW:15}

# Password reset settings
security.password-reset.expiration-hours=1

# Password encoding strength (BCrypt rounds)
security.password.encoder.strength=12

# Spring Security default user (disable in production)
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin123}

# ===============================
# SESSION CONFIGURATION
# ===============================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=strict

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.webapp.auth=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Log file configuration
logging.file.name=${LOG_FILE_PATH:logs/auth-system.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ===============================
# CORS CONFIGURATION
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===============================
# EMAIL CONFIGURATION (For Password Reset)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.info.env.enabled=true

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=${ERROR_STACKTRACE:on_param}
server.error.include-exception=false
server.error.whitelabel.enabled=false

# ===============================
# HTTPS CONFIGURATION (Production)
# ===============================
# Uncomment and configure for HTTPS in production
# Generate keystore: keytool -genkeypair -alias tomcat -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore keystore.p12 -validity 3650
server.ssl.enabled=${SSL_ENABLED:false}
#server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
#server.ssl.key-store-password=${SSL_PASSWORD:changeit}
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=tomcat
#server.ssl.protocol=TLS
#server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ===============================
# RATE LIMITING CONFIGURATION
# ===============================
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
rate.limit.requests-per-minute=60

# ===============================
# APPLICATION SPECIFIC SETTINGS
# ===============================
app.name=Secure Authentication System
app.version=1.0.0
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.token-expiration=3600000
# Password reset token expiration (3600000 ms = 1 hour)
app.security.max-login-attempts=5
app.security.lockout-duration=30

# ===============================
# SQL INITIALIZATION CONFIGURATION
# ===============================
# Enable SQL script execution on startup (disable in production)
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8

# For production, set to 'never' and use Flyway/Liquibase for migrations
# spring.sql.init.mode=never

# ===============================
# SPRINGDOC OPENAPI (SWAGGER) CONFIGURATION
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

# ===============================
# MULTIPART FILE UPLOAD CONFIGURATION
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# JACKSON CONFIGURATION
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ===============================
# BANNER CONFIGURATION
# ===============================
spring.banner.location=classpath:banner.txt

