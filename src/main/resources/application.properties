# ===============================
# APPLICATION CONFIGURATION
# ===============================
spring.application.name=secure-auth-system
server.port=8080

# ===============================
# DATABASE CONFIGURATION
# ===============================
# MySQL Configuration (Primary)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL Configuration (Alternative - Uncomment to use)
#spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===============================
# JWT CONFIGURATION
# ===============================
# JWT Secret Key (Change this in production - use environment variable)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
# JWT expiration time in milliseconds (86400000 ms = 24 hours)
jwt.refresh.expiration=604800000
# Refresh token expiration (604800000 ms = 7 days)

# ===============================
# SECURITY CONFIGURATION
# ===============================
# Account lockout settings
security.max-failed-attempts=5
security.lockout-duration=900000
security.lockout-duration-minutes=15

# Rate limiting settings (brute force protection)
security.rate-limit.max-attempts=10
security.rate-limit.window-minutes=15

# Password reset settings
security.password-reset.expiration-hours=1
# Lockout duration in milliseconds (900000 ms = 15 minutes)

# Session timeout settings
server.servlet.session.timeout=30m
# Session timeout after 30 minutes of inactivity

# Password encoding strength
security.password.encoder.strength=12

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.webapp.auth=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log file configuration
logging.file.name=logs/auth-system.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# CORS CONFIGURATION
# ===============================
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# ===============================
# EMAIL CONFIGURATION (For Password Reset)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===============================
# ACTUATOR CONFIGURATION
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ===============================
# ERROR HANDLING
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ===============================
# HTTPS CONFIGURATION (Production)
# ===============================
# Uncomment and configure for HTTPS in production
#server.ssl.enabled=true
#server.ssl.key-store=classpath:keystore.p12
#server.ssl.key-store-password=your-keystore-password
#server.ssl.key-store-type=PKCS12
#server.ssl.key-alias=tomcat

# ===============================
# RATE LIMITING CONFIGURATION
# ===============================
rate.limit.enabled=true
rate.limit.requests-per-minute=60

# ===============================
# APPLICATION SPECIFIC SETTINGS
# ===============================
app.name=Secure Authentication System
app.version=1.0.0
app.frontend.url=http://localhost:3000
app.password-reset.token-expiration=3600000
# Password reset token expiration (3600000 ms = 1 hour)



# ============================================================================
# SQL Initialization Configuration
# ============================================================================
# Enable SQL script execution on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8

# For production, set to 'never' and use Flyway/Liquibase for migrations
# spring.sql.init.mode=never


# ============================================
# SpringDoc OpenAPI (Swagger) Configuration
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false
